<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PulseFrame — Dev. By BaxTech</title>
<style>
:root{--bg:#f3f4f8;--fg:#13151c;--mut:#6a7085;--card:#fff;--line:#dfe2ec;--acc:#e5214f;--acc2:#6d4dff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b0c11;--fg:#f2f3f7;--mut:#9399ae;--card:#14161e;--line:#262a38;--acc:#ff4d6d;--acc2:#8a6dff}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b0c11;--fg:#f2f3f7;--mut:#9399ae;--card:#14161e;--line:#262a38;--acc:#ff4d6d;--acc2:#8a6dff}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:14px 16px 24px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center}
h1{font-size:1.2rem;margin:0;line-height:1.1}
.tag{color:var(--mut);font-size:.78rem}
.by{padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:.74rem;font-weight:600;white-space:nowrap}
.by b{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stage{background:#000;border-radius:16px;overflow:hidden;display:flex;justify-content:center;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.18)}
canvas{max-width:100%;max-height:68vh;height:auto;width:auto;display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.tile{display:flex;gap:12px;align-items:center;padding:12px;border:1.5px dashed var(--line);border-radius:12px;cursor:pointer;min-width:0}
.tile.over,.tile:hover{border-color:var(--acc)}
.tile input{display:none}
.ic{flex:none;width:40px;height:40px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:1.15rem}
.tile div{min-width:0}.tile strong{display:block;font-size:.92rem}
.tile span{display:block;color:var(--mut);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr{display:flex;align-items:center;gap:12px;margin-top:14px}
.play{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:1rem;cursor:pointer}
.tm{flex:none;color:var(--mut);font-size:.8rem;font-variant-numeric:tabular-nums}
input[type=range]{accent-color:var(--acc);width:100%}
.sl{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:14px}
@media(max-width:560px){.sl{grid-template-columns:1fr}}
.sl label{font-size:.82rem;color:var(--mut);display:block}
.opts{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px}
select,button.b{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
.chk{display:flex;align-items:center;gap:6px;font-size:.88rem;color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
button.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#fff;font-weight:600}
button:disabled{opacity:.4;cursor:not-allowed}
.pg{height:6px;border-radius:9px;background:var(--bg);margin-top:14px;overflow:hidden}.pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2))}
#msg{margin-top:10px;font-size:.86rem;color:var(--mut);min-height:1.2em}
video{width:100%;max-height:50vh;margin-top:10px;border-radius:12px;background:#000}
footer{text-align:center;color:var(--mut);font-size:.78rem;margin-top:18px}
</style></head>
<body><main>
<header>
  <div class="brand"><div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M3 12h3l3-8 4 16 3-8h5"/></svg></div>
  <div><h1>PulseFrame</h1><div class="tag">Audio-reactive visuals</div></div></div>
  <div class="by">Dev. By <b>BaxTech</b></div>
</header>
<div class="stage"><canvas id="cv" width="960" height="540"></canvas></div>
<div class="card">
  <div class="grid">
    <label class="tile" id="ta"><input id="fa" type="file" accept="audio/*"><div class="ic">🎵</div><div><strong>1. Audio</strong><span id="na">Tap or drop a song</span></div></label>
    <label class="tile" id="ti"><input id="fi" type="file" accept="image/*"><div class="ic">🖼️</div><div><strong>2. Image</strong><span id="ni">Tap or drop an image</span></div></label>
  </div>
  <div class="tr">
    <button class="play" id="pl" disabled aria-label="Play">▶</button>
    <input id="sk" type="range" min="0" max="1000" value="0" disabled>
    <span class="tm" id="tm">0:00 / 0:00</span>
  </div>
  <div class="sl">
    <div><label>Bass punch (zoom + glow)</label><input id="kb" type="range" min="0.5" max="2" step="0.1" value="1"></div>
    <div><label>Treble shake</label><input id="kt" type="range" min="0" max="2" step="0.1" value="1"></div>
  </div>
  <div class="opts">
    <select id="ar" aria-label="Shape"><option value="ls">Wide 16:9</option><option value="pt">Vertical 9:16</option><option value="sq">Square 1:1</option></select>
  </div>
  <div class="row">
    <button id="ex" class="b pri" disabled>3. Export video</button>
    <button id="sv" class="b" disabled>Save video</button>
  </div>
  <div class="pg"><i id="pb"></i></div>
  <div id="msg">Add an audio file to begin.</div>
  <video id="pv" controls hidden></video>
</div>
<footer>PulseFrame · Dev. By BaxTech</footer>
</main>
<audio id="au" hidden></audio>
<script>
const $=i=>document.getElementById(i),cv=$('cv'),cx=cv.getContext('2d'),au=$('au'),msg=$('msg');
const sizes={sq:[720,720],pt:[540,960],ls:[960,540]};
let ctx,an,src,spk,dst,fd,img=null,rec=false,blob=null,ext='mp4',b=0,t=0;
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
$('ar').onchange=()=>{const[w,h]=sizes[$('ar').value];cv.width=w;cv.height=h};
function initAudio(){
  if(ctx)return;
  ctx=new(window.AudioContext||window.webkitAudioContext)();
  an=ctx.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=.55;
  src=ctx.createMediaElementSource(au);spk=ctx.createGain();dst=ctx.createMediaStreamDestination();
  src.connect(an);an.connect(spk);spk.connect(ctx.destination);an.connect(dst);
  fd=new Uint8Array(an.frequencyBinCount);
}
function loadAudio(f){
  if(!f)return;au.src=URL.createObjectURL(f);$('na').textContent=f.name;
  ['pl','sk','ex'].forEach(i=>$(i).disabled=false);$('sv').disabled=true;
  msg.textContent='Audio ready. Press play to preview.';
}
function loadImg(f){
  if(!f)return;const i=new Image();i.onload=()=>{img=i};i.src=URL.createObjectURL(f);$('ni').textContent=f.name;
}
$('fa').onchange=e=>loadAudio(e.target.files[0]);
$('fi').onchange=e=>loadImg(e.target.files[0]);
[['ta',loadAudio],['ti',loadImg]].forEach(([id,fn])=>{
  const el=$(id);
  el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('over')});
  el.addEventListener('dragleave',()=>el.classList.remove('over'));
  el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('over');fn(e.dataTransfer.files[0])});
});
$('pl').onclick=()=>{if(rec)return;au.paused?au.play():au.pause()};
au.addEventListener('play',()=>{initAudio();ctx.resume();$('pl').textContent='❚❚'});
au.addEventListener('pause',()=>{$('pl').textContent='▶'});
au.addEventListener('ended',()=>{$('pl').textContent='▶'});
au.addEventListener('timeupdate',()=>{
  if(!au.duration)return;
  $('sk').value=au.currentTime/au.duration*1000;
  $('tm').textContent=fmt(au.currentTime)+' / '+fmt(au.duration);
  if(rec)$('pb').style.width=(au.currentTime/au.duration*100)+'%';
});
$('sk').oninput=()=>{if(au.duration&&!rec)au.currentTime=$('sk').value/1000*au.duration};
const avg=(a,z)=>{let s=0;for(let i=a;i<z;i++)s+=fd[i];return s/(z-a)/255};
function frame(){
  requestAnimationFrame(frame);
  const W=cv.width,H=cv.height;
  let nb=0,nt=0;
  if(an&&!au.paused){an.getByteFrequencyData(fd);nb=Math.pow(avg(1,7),1.6)*(+$('kb').value)*1.3;nt=Math.pow(avg(90,250),1.3)*(+$('kt').value)*2.2}
  b=Math.max(Math.min(nb,1),b*.88);t=Math.max(Math.min(nt,1),t*.82);
  cx.fillStyle='#050509';cx.fillRect(0,0,W,H);
  const z=1.07+b*.15;
  cx.save();
  cx.translate(W/2+(Math.random()-.5)*t*22,H/2+(Math.random()-.5)*t*22);
  cx.rotate((Math.random()-.5)*t*.025);
  cx.scale(z,z);
  if(img){const r=Math.max(W/img.width,H/img.height);cx.drawImage(img,-img.width*r/2,-img.height*r/2,img.width*r,img.height*r)}
  else{const pg=cx.createLinearGradient(-W/2,-H/2,W/2,H/2);pg.addColorStop(0,'#ff4d6d');pg.addColorStop(1,'#6d4dff');cx.fillStyle=pg;cx.fillRect(-W/2,-H/2,W,H);
    cx.fillStyle='rgba(255,255,255,.9)';cx.textAlign='center';cx.font=`600 ${Math.min(W,H)*.05}px system-ui`;cx.fillText('Upload an image',0,0)}
  cx.restore();
  const vg=cx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);
  vg.addColorStop(0,'rgba(255,40,90,0)');vg.addColorStop(1,`rgba(255,40,90,${b*.5})`);
  cx.fillStyle=vg;cx.fillRect(0,0,W,H);
  if(t>.05){cx.fillStyle=`rgba(255,255,255,${t*.07})`;cx.fillRect(0,0,W,H)}
}
frame();
$('ex').onclick=async()=>{
  if(rec||!au.src)return;
  initAudio();await ctx.resume();
  const types=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  const mt=types.find(x=>window.MediaRecorder&&MediaRecorder.isTypeSupported(x));
  if(!mt){msg.textContent='This browser can’t record video. Try Chrome.';return}
  ext=mt.startsWith('video/mp4')?'mp4':'webm';
  const st=cv.captureStream(30);dst.stream.getAudioTracks().forEach(x=>st.addTrack(x));
  const mr=new MediaRecorder(st,{mimeType:mt,videoBitsPerSecond:5e6}),ch=[];
  mr.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
  rec=true;blob=null;['sv','ex','ar','pl','sk'].forEach(i=>$(i).disabled=true);
  spk.gain.value=0;au.pause();au.currentTime=0;$('pb').style.width='0';
  msg.textContent='Recording… keep this tab open until it finishes.';
  mr.onstop=()=>{
    rec=false;spk.gain.value=1;['ex','ar','pl','sk'].forEach(i=>$(i).disabled=false);
    blob=new Blob(ch,{type:mt.split(';')[0]});
    const pv=$('pv');pv.src=URL.createObjectURL(blob);pv.hidden=false;
    $('sv').disabled=false;$('pb').style.width='100%';
    msg.textContent='Done. Preview below, then tap Save video ('+ext.toUpperCase()+').';
  };
  au.addEventListener('ended',()=>{if(mr.state!=='inactive')mr.stop()},{once:true});
  mr.start(500);await au.play();
};
$('sv').onclick=async()=>{
  if(!blob)return;
  try{
    const d=window.claude&&await claude.use('downloads');
    if(d){await d.save({filename:'pulseframe.'+ext,data:blob})}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pulseframe.'+ext;document.body.appendChild(a);a.click();a.remove()}
    msg.textContent='Saved.';
  }catch(e){msg.textContent=e&&e.code==='declined'?'Save cancelled.':'Couldn’t save: '+((e&&e.message)||e)}
};
</script></body></html>
