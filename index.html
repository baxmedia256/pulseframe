<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PulseFrame — Dev. By BaxTech</title>
<meta name="theme-color" content="#0b0c11">
<meta name="description" content="PulseFrame: audio-reactive visuals. Dev. By BaxTech">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PulseFrame">
<style>
:root{--bg:#f3f4f8;--fg:#13151c;--mut:#6a7085;--card:#fff;--line:#dfe2ec;--acc:#e5214f;--acc2:#6d4dff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b0c11;--fg:#f2f3f7;--mut:#9399ae;--card:#14161e;--line:#262a38;--acc:#ff4d6d;--acc2:#8a6dff}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b0c11;--fg:#f2f3f7;--mut:#9399ae;--card:#14161e;--line:#262a38;--acc:#ff4d6d;--acc2:#8a6dff}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:14px 16px 24px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center}
h1{font-size:1.2rem;margin:0;line-height:1.1}
.tag{color:var(--mut);font-size:.78rem}
.by{padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:.74rem;font-weight:600;white-space:nowrap}
.by b{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stage{background:#000;border-radius:16px;overflow:hidden;display:flex;justify-content:center;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.18)}
canvas{max-width:100%;max-height:68vh;height:auto;width:auto;display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.tile{display:flex;gap:12px;align-items:center;padding:12px;border:1.5px dashed var(--line);border-radius:12px;cursor:pointer;min-width:0}
.tile.over,.tile:hover{border-color:var(--acc)}
.tile input{display:none}
.ic{flex:none;width:40px;height:40px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:1.15rem}
.tile div{min-width:0}.tile strong{display:block;font-size:.92rem}
.tile span{display:block;color:var(--mut);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr{display:flex;align-items:center;gap:12px;margin-top:14px}
.play{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:1rem;cursor:pointer}
.tm{flex:none;color:var(--mut);font-size:.8rem;font-variant-numeric:tabular-nums}
input[type=range]{accent-color:var(--acc);width:100%}
.sl{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:14px}
@media(max-width:560px){.sl{grid-template-columns:1fr}}
.sl label{font-size:.82rem;color:var(--mut);display:block}
.opts{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px}
select,button.b{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
.chk{display:flex;align-items:center;gap:6px;font-size:.88rem;color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
button.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#fff;font-weight:600}
button:disabled{opacity:.4;cursor:not-allowed}
.pg{height:6px;border-radius:9px;background:var(--bg);margin-top:14px;overflow:hidden}.pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2))}
#msg{margin-top:10px;font-size:.86rem;color:var(--mut);min-height:1.2em}
video{width:100%;max-height:50vh;margin-top:10px;border-radius:12px;background:#000}
button.by{font:inherit;font-size:.74rem;font-weight:600;color:var(--fg);cursor:pointer}
.sec{margin:20px 0 8px;font-size:.76rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.g2{grid-template-columns:1fr}}
input[type=text]{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;width:100%}
input[type=color]{width:38px;height:30px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer}
.tl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;font-size:.84rem;color:var(--mut)}
footer{text-align:center;color:var(--mut);font-size:.78rem;margin-top:18px}
#md{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;z-index:50;padding:16px}
.mb{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;width:100%;max-width:560px;max-height:100%;overflow:auto;display:grid;gap:10px}
.mb .mut{color:var(--mut);font-size:.82rem}
#cc{width:100%;height:auto;border-radius:10px;touch-action:none;cursor:grab;background:#000}
.mb .row{margin-top:2px}
</style></head>
<body><main>
<header>
  <div class="brand"><div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M3 12h3l3-8 4 16 3-8h5"/></svg></div>
  <div><h1>PulseFrame</h1><div class="tag">Audio-reactive visuals</div></div></div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end"><button id="inst" class="by" hidden>⬇ Install app</button><div class="by">Dev. By <b>BaxTech</b></div></div>
</header>
<div class="stage"><canvas id="cv" width="960" height="540"></canvas></div>
<div class="card">
  <div class="grid">
    <label class="tile" id="ta"><input id="fa" type="file" accept="audio/*"><div class="ic">🎵</div><div><strong>1. Audio</strong><span id="na">Tap or drop a song</span></div></label>
    <label class="tile" id="ti"><input id="fi" type="file" accept="image/*"><div class="ic">🖼️</div><div><strong>2. Image</strong><span id="ni">Tap or drop an image</span></div></label>
  </div>
  <div class="tr">
    <button class="play" id="pl" disabled aria-label="Play">▶</button>
    <input id="sk" type="range" min="0" max="1000" value="0" disabled>
    <span class="tm" id="tm">0:00 / 0:00</span>
  </div>
  <div class="sl">
    <div><label>Bass punch (zoom + glow)</label><input id="kb" type="range" min="0.5" max="2" step="0.1" value="1"></div>
    <div><label>Treble shake</label><input id="kt" type="range" min="0" max="2" step="0.1" value="1"></div>
  </div>
  <div class="opts">
    <select id="ar" aria-label="Shape"><option value="ls">Wide 16:9</option><option value="pt">Vertical 9:16</option><option value="sq">Square 1:1</option></select>
    <button id="cr" class="b" disabled>✂ Crop image</button>
  </div>
  <div class="sec">Text &amp; logo</div>
  <div class="g2"><input id="tt1" type="text" placeholder="Title (song name)" maxlength="60"><input id="tt2" type="text" placeholder="Subtitle (e.g. Prod. by BaxBeatzy)" maxlength="60"></div>
  <div class="opts">
    <select id="tp" aria-label="Text position"><option value="b">Text: bottom</option><option value="t">Text: top</option><option value="c">Text: center</option></select>
    <select id="tf" aria-label="Font"><option value="system-ui,sans-serif">Font: Clean</option><option value="Georgia,serif">Font: Serif</option><option value="Impact,'Arial Black',sans-serif">Font: Bold</option><option value="'Courier New',monospace">Font: Mono</option></select>
    <label class="chk">Color <input id="tc" type="color" value="#ffffff"></label>
  </div>
  <div class="opts">
    <button id="lg" class="b">Add logo</button><input id="fl" type="file" accept="image/*" hidden><button id="lx" class="b" hidden>Remove logo</button>
    <select id="lp" aria-label="Logo position"><option value="tr">Logo: top right</option><option value="tl">Logo: top left</option><option value="br">Logo: bottom right</option><option value="bl">Logo: bottom left</option></select>
    <label class="chk">Size <input id="ls2" type="range" min="6" max="30" value="14"></label>
  </div>
  <div class="opts" id="lop" hidden>
    <label class="chk"><input id="lt" type="checkbox"> Make background transparent</label>
    <label class="chk">Strength <input id="lk" type="range" min="5" max="100" value="35"></label>
    <label class="chk">Opacity <input id="lo" type="range" min="10" max="100" value="100"></label>
  </div>
  <div class="sec">Reactions</div>
  <div class="opts">
    <label class="chk"><input id="e1" type="checkbox" checked> Ring spectrum</label>
    <label class="chk"><input id="e2" type="checkbox" checked> Particles</label>
    <label class="chk"><input id="e3" type="checkbox" checked> Glitch on treble</label>
    <label class="chk"><input id="e4" type="checkbox" checked> Beat flash</label>
  </div>
  <div class="sec">Trim audio &amp; quality</div>
  <div class="tl">
    <span>Start</span><input id="ts" type="range" min="0" max="1000" value="0">
    <span>End</span><input id="te" type="range" min="0" max="1000" value="1000">
  </div>
  <div class="opts">
    <span id="tr" class="chk">Load audio first</span>
    <button id="tpv" class="b">▶ Preview trim</button>
    <select id="ql" aria-label="Quality"><option value="720">Quality: 720p (faster)</option><option value="1080">Quality: 1080p (sharper)</option></select>
  </div>
  <div class="row">
    <button id="ex" class="b pri" disabled>3. Export video</button>
    <button id="sv" class="b" disabled>Save video</button>
  </div>
  <div class="pg"><i id="pb"></i></div>
  <div id="msg">Add an audio file to begin.</div>
  <video id="pv" controls hidden></video>
</div>
<footer>PulseFrame · Dev. By BaxTech</footer>
</main>
<div id="md" hidden><div class="mb">
  <b>Crop image</b>
  <div class="mut">Drag the image to move it and use the slider to zoom. The frame matches the shape you picked.</div>
  <canvas id="cc"></canvas>
  <input id="cz" type="range" min="1" max="4" step="0.01" value="1" aria-label="Zoom">
  <div class="row"><button id="cok" class="b pri">Apply crop</button><button id="crs" class="b">Remove crop</button><button id="cno" class="b">Cancel</button></div>
</div></div>
<audio id="au" hidden></audio>
<script>
const $=i=>document.getElementById(i),cv=$('cv'),cx=cv.getContext('2d'),au=$('au'),msg=$('msg');
const sizes={sq:[720,720],pt:[540,960],ls:[960,540]};
let ctx,an,src,spk,dst,fd,img=null,rec=false,blob=null,ext='mp4',b=0,t=0;
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
$('ar').onchange=()=>{const[w,h]=sizes[$('ar').value];cv.width=w;cv.height=h;bake()};
function initAudio(){
  if(ctx)return;
  ctx=new(window.AudioContext||window.webkitAudioContext)();
  an=ctx.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=.55;
  src=ctx.createMediaElementSource(au);spk=ctx.createGain();dst=ctx.createMediaStreamDestination();
  src.connect(an);an.connect(spk);spk.connect(ctx.destination);an.connect(dst);
  fd=new Uint8Array(an.frequencyBinCount);
}
function loadAudio(f){
  if(!f)return;au.src=URL.createObjectURL(f);$('na').textContent=f.name;
  ['pl','sk','ex'].forEach(i=>$(i).disabled=false);$('sv').disabled=true;
  msg.textContent='Audio ready. Press play to preview.';
}
function loadImg(f){
  if(!f)return;const i=new Image();i.onload=()=>{imgO=i;crop={x:.5,y:.5,z:1,on:false};bake();$('cr').disabled=false};i.src=URL.createObjectURL(f);$('ni').textContent=f.name;
}
$('fa').onchange=e=>loadAudio(e.target.files[0]);
$('fi').onchange=e=>loadImg(e.target.files[0]);
[['ta',loadAudio],['ti',loadImg]].forEach(([id,fn])=>{
  const el=$(id);
  el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('over')});
  el.addEventListener('dragleave',()=>el.classList.remove('over'));
  el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('over');fn(e.dataTransfer.files[0])});
});
$('pl').onclick=()=>{if(rec)return;au.paused?au.play():au.pause()};
au.addEventListener('play',()=>{initAudio();ctx.resume();$('pl').textContent='❚❚';const tr=trim();if(au.duration&&(au.currentTime<tr.s-.05||au.currentTime>=tr.e-.05))au.currentTime=tr.s});
au.addEventListener('pause',()=>{$('pl').textContent='▶'});
au.addEventListener('ended',()=>{$('pl').textContent='▶'});
au.addEventListener('timeupdate',()=>{
  if(!au.duration)return;
  $('sk').value=au.currentTime/au.duration*1000;
  $('tm').textContent=fmt(au.currentTime)+' / '+fmt(au.duration);
  if(rec){const tr=trim();$('pb').style.width=Math.min(100,Math.max(0,(au.currentTime-tr.s)/(tr.e-tr.s)*100))+'%'}
});
$('sk').oninput=()=>{if(au.duration&&!rec)au.currentTime=$('sk').value/1000*au.duration};
// ===== Image crop (pan + zoom inside the chosen frame) =====
let imgO=null,crop={x:.5,y:.5,z:1,on:false},cd=null,dr=null;
const cc=$('cc'),cg=cc.getContext('2d');
function win(c){
  const A=cv.width/cv.height,iw=imgO.width,ih=imgO.height,bw=Math.min(iw,ih*A),w=bw/c.z,h=w/A;
  const x=Math.min(Math.max(c.x*iw-w/2,0),iw-w),y=Math.min(Math.max(c.y*ih-h/2,0),ih-h);
  return{x,y,w,h};
}
function clampC(){const w=win(cd);cd.x=(w.x+w.w/2)/imgO.width;cd.y=(w.y+w.h/2)/imgO.height}
function bake(){
  if(!imgO)return;
  if(!crop.on){img=imgO;return}
  const w=win(crop),c=document.createElement('canvas');
  c.width=Math.round(cv.width*1.2);c.height=Math.round(cv.height*1.2);
  c.getContext('2d').drawImage(imgO,w.x,w.y,w.w,w.h,0,0,c.width,c.height);
  img=c;
}
function ccDraw(){const w=win(cd);cg.drawImage(imgO,w.x,w.y,w.w,w.h,0,0,cc.width,cc.height)}
$('cr').onclick=()=>{
  if(!imgO||rec)return;
  cd={x:crop.x,y:crop.y,z:crop.z,on:true};
  cc.width=cv.width;cc.height=cv.height;$('cz').value=cd.z;$('md').hidden=false;ccDraw();
};
cc.onpointerdown=e=>{dr={x:e.clientX,y:e.clientY};cc.setPointerCapture(e.pointerId)};
cc.onpointermove=e=>{
  if(!dr)return;
  const w=win(cd),r=cc.getBoundingClientRect(),k=w.w/r.width;
  cd.x-=(e.clientX-dr.x)*k/imgO.width;cd.y-=(e.clientY-dr.y)*k/imgO.height;
  dr={x:e.clientX,y:e.clientY};clampC();ccDraw();
};
cc.onpointerup=cc.onpointercancel=()=>{dr=null};
$('cz').oninput=()=>{cd.z=+$('cz').value;clampC();ccDraw()};
$('cok').onclick=()=>{crop=cd;crop.on=true;bake();$('md').hidden=true};
$('crs').onclick=()=>{crop={x:.5,y:.5,z:1,on:false};bake();$('md').hidden=true};
$('cno').onclick=()=>{$('md').hidden=true};
const avg=(a,z)=>{let s=0;for(let i=a;i<z;i++)s+=fd[i];return s/(z-a)/255};
// ===== Text, logo, reactions, trim, quality =====
const ps=[];let rot=0,flash=0,pnb=0,logo=null,logoC=null,lq=0;
function trim(){const d=au.duration||0;let s=$('ts').value/1000*d,e=$('te').value/1000*d;if(e-s<1)e=Math.min(d,s+1);return{s,e}}
function updTrim(){const r=trim();$('tr').textContent=au.duration?fmt(r.s)+' – '+fmt(r.e)+' ('+fmt(r.e-r.s)+')':'Load audio first'}
$('ts').oninput=()=>{if(+$('ts').value>+$('te').value-5)$('ts').value=+$('te').value-5;updTrim()};
$('te').oninput=()=>{if(+$('te').value<+$('ts').value+5)$('te').value=+$('ts').value+5;updTrim()};
au.addEventListener('loadedmetadata',()=>{$('ts').value=0;$('te').value=1000;updTrim()});
$('tpv').onclick=()=>{if(!au.src||rec)return;au.currentTime=trim().s;au.play()};
function setSize(){
  const q=+$('ql').value,d={ls:[q*16/9,q],pt:[q,q*16/9],sq:[q,q]}[$('ar').value];
  cv.width=Math.round(d[0]/2)*2;cv.height=Math.round(d[1]/2)*2;bake();
}
$('ar').onchange=$('ql').onchange=setSize;
$('lg').onclick=()=>$('fl').click();
$('fl').onchange=e=>{const f=e.target.files[0];if(!f)return;const i=new Image();i.onload=()=>{logo=i;buildLogo();$('lx').hidden=false;$('lop').hidden=false;$('lg').textContent='Change logo'};i.src=URL.createObjectURL(f)};
$('lx').onclick=()=>{logo=null;logoC=null;$('lx').hidden=true;$('lop').hidden=true;$('lg').textContent='Add logo';$('fl').value=''};
$('lt').onchange=()=>buildLogo();
$('lk').oninput=()=>{clearTimeout(lq);lq=setTimeout(buildLogo,60)};
// Remove the logo's background: flood-fill from the edges so only the outer background goes
function buildLogo(){
  if(!logo)return;
  const k=Math.min(1,600/Math.max(logo.width,logo.height)),w=Math.max(1,Math.round(logo.width*k)),h=Math.max(1,Math.round(logo.height*k));
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(logo,0,0,w,h);
  if($('lt').checked){
    const im=g.getImageData(0,0,w,h),d=im.data,T=+$('lk').value*2.2;
    if(d[3]>10){
      const bg=[d[0],d[1],d[2]],dist=i=>Math.hypot(d[i]-bg[0],d[i+1]-bg[1],d[i+2]-bg[2]);
      const seen=new Uint8Array(w*h),st=[];
      const push=(x,y)=>{const j=y*w+x;if(seen[j])return;if(d[j*4+3]>10&&dist(j*4)>T)return;seen[j]=1;st.push(j)};
      for(let x=0;x<w;x++){push(x,0);push(x,h-1)}
      for(let y=0;y<h;y++){push(0,y);push(w-1,y)}
      while(st.length){const j=st.pop(),x=j%w,y=(j-x)/w;if(x>0)push(x-1,y);if(x<w-1)push(x+1,y);if(y>0)push(x,y-1);if(y<h-1)push(x,y+1)}
      for(let j=0;j<w*h;j++){
        const i=j*4;
        if(seen[j]){d[i+3]=0;continue}
        const x=j%w,y=(j-x)/w;
        if((x>0&&seen[j-1])||(x<w-1&&seen[j+1])||(y>0&&seen[j-w])||(y<h-1&&seen[j+w])){d[i+3]=d[i+3]*Math.min(1,Math.max(0,(dist(i)-T)/(T*.6+1)))}
      }
      g.putImageData(im,0,0);
    }
  }
  logoC=c;
}
function fx(W,H,nb){
  const m=Math.min(W,H),play=an&&!au.paused;
  if($('e4').checked){if(nb>.7&&nb>pnb+.1)flash=1;flash*=.88;if(flash>.02){cx.fillStyle=`rgba(255,255,255,${flash*.22})`;cx.fillRect(0,0,W,H)}}
  pnb=nb;
  if($('e1').checked){
    rot+=.003+b*.015;const n=64,r0=m*.26;
    cx.save();cx.translate(W/2,H/2);cx.rotate(rot);cx.lineCap='round';cx.lineWidth=Math.max(3,m*.007);
    for(let i=0;i<n;i++){
      const idx=i<n/2?i:n-1-i,v=play?fd[2+idx*5]/255:0,l=m*.015+v*m*.17,a=i/n*Math.PI*2;
      cx.strokeStyle=`hsla(${320+i*2},95%,${62+v*18}%,.9)`;
      cx.beginPath();cx.moveTo(Math.cos(a)*r0,Math.sin(a)*r0);cx.lineTo(Math.cos(a)*(r0+l),Math.sin(a)*(r0+l));cx.stroke();
    }
    cx.restore();
  }
  if($('e2').checked){
    if(play&&ps.length<160){const c=1+Math.floor(b*5+t*3);for(let i=0;i<c;i++)ps.push({x:Math.random(),y:1.02,vx:(Math.random()-.5)*.002,vy:-(.002+Math.random()*.006)*(1+b*2),r:.004+Math.random()*.01,h:300+Math.random()*80,l:1})}
    cx.save();cx.globalCompositeOperation='lighter';
    for(let i=ps.length-1;i>=0;i--){
      const q=ps[i];q.x+=q.vx;q.y+=q.vy;q.l-=.006;
      if(q.l<=0||q.y<-.05){ps.splice(i,1);continue}
      cx.fillStyle=`hsla(${q.h},100%,65%,${q.l*.7})`;cx.beginPath();cx.arc(q.x*W,q.y*H,q.r*m,0,7);cx.fill();
    }
    cx.restore();
  }
  const t1=$('tt1').value.trim(),t2=$('tt2').value.trim();
  if(t1||t2){
    const pos=$('tp').value,fam=$('tf').value,y=pos==='t'?H*.14:pos==='c'?H*.5:H*.86;
    if(pos!=='c'){const g=cx.createLinearGradient(0,pos==='t'?0:H,0,pos==='t'?H*.4:H*.6);g.addColorStop(0,'rgba(0,0,0,.55)');g.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=g;cx.fillRect(0,0,W,H)}
    cx.save();cx.textAlign='center';cx.textBaseline='middle';cx.fillStyle=$('tc').value;cx.shadowColor='rgba(0,0,0,.7)';cx.shadowBlur=m*.02;
    cx.translate(W/2,y);const sc=1+b*.04;cx.scale(sc,sc);
    if(t1){cx.font=`700 ${m*.075}px ${fam}`;cx.fillText(t1,0,t2?-m*.03:0,W*.88)}
    if(t2){cx.font=`500 ${m*.042}px ${fam}`;cx.globalAlpha=.9;cx.fillText(t2,0,t1?m*.05:0,W*.88)}
    cx.restore();
  }
  if(logoC){
    const sz=m*(+$('ls2').value)/100,r=Math.min(sz/logoC.width,sz/logoC.height),w=logoC.width*r,h=logoC.height*r,pad=m*.035,p=$('lp').value;
    cx.save();cx.globalAlpha=(+$('lo').value)/100;cx.drawImage(logoC,p.includes('r')?W-w-pad:pad,p.includes('b')?H-h-pad:pad,w,h);cx.restore();
  }
}
function frame(){
  requestAnimationFrame(frame);
  const W=cv.width,H=cv.height;
  let nb=0,nt=0;
  if(an&&!au.paused){an.getByteFrequencyData(fd);nb=Math.pow(avg(1,7),1.6)*(+$('kb').value)*1.3;nt=Math.pow(avg(90,250),1.3)*(+$('kt').value)*2.2}
  b=Math.max(Math.min(nb,1),b*.88);t=Math.max(Math.min(nt,1),t*.82);
  if(!au.paused&&au.duration&&au.currentTime>=trim().e){au.pause();au.dispatchEvent(new Event('ended'))}
  cx.fillStyle='#050509';cx.fillRect(0,0,W,H);
  const z=1.07+b*.15;
  cx.save();
  cx.translate(W/2+(Math.random()-.5)*t*22,H/2+(Math.random()-.5)*t*22);
  cx.rotate((Math.random()-.5)*t*.025);
  cx.scale(z,z);
  if(img){const r=Math.max(W/img.width,H/img.height);cx.drawImage(img,-img.width*r/2,-img.height*r/2,img.width*r,img.height*r)}
  else{const pg=cx.createLinearGradient(-W/2,-H/2,W/2,H/2);pg.addColorStop(0,'#ff4d6d');pg.addColorStop(1,'#6d4dff');cx.fillStyle=pg;cx.fillRect(-W/2,-H/2,W,H);
    cx.fillStyle='rgba(255,255,255,.9)';cx.textAlign='center';cx.font=`600 ${Math.min(W,H)*.05}px system-ui`;cx.fillText('Upload an image',0,0)}
  cx.restore();
  if($('e3').checked&&t>.3){
    for(let i=0;i<3;i++){const y=Math.random()*H,h=H*(.015+Math.random()*.05),dx=(Math.random()-.5)*W*.07*t;cx.drawImage(cv,0,y,W,h,dx,y,W,h)}
    cx.save();cx.globalCompositeOperation='screen';const o=Math.max(2,W*.004)*t*3;
    cx.fillStyle='rgba(255,0,70,.12)';cx.fillRect(-o,0,W,H);cx.fillStyle='rgba(0,190,255,.12)';cx.fillRect(o,0,W,H);cx.restore();
  }
  const vg=cx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);
  vg.addColorStop(0,'rgba(255,40,90,0)');vg.addColorStop(1,`rgba(255,40,90,${b*.5})`);
  cx.fillStyle=vg;cx.fillRect(0,0,W,H);
  if(t>.05){cx.fillStyle=`rgba(255,255,255,${t*.07})`;cx.fillRect(0,0,W,H)}
  fx(W,H,nb);
}
frame();
$('ex').onclick=async()=>{
  if(rec||!au.src)return;
  initAudio();await ctx.resume();
  const types=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  const mt=types.find(x=>window.MediaRecorder&&MediaRecorder.isTypeSupported(x));
  if(!mt){msg.textContent='This browser can’t record video. Try Chrome.';return}
  ext=mt.startsWith('video/mp4')?'mp4':'webm';
  const st=cv.captureStream(30);dst.stream.getAudioTracks().forEach(x=>st.addTrack(x));
  const mr=new MediaRecorder(st,{mimeType:mt,videoBitsPerSecond:5e6}),ch=[];
  mr.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
  rec=true;blob=null;['sv','ex','ar','pl','sk','ql','ts','te','tpv'].forEach(i=>$(i).disabled=true);
  spk.gain.value=0;au.pause();au.currentTime=trim().s;$('pb').style.width='0';
  msg.textContent='Recording… keep this tab open until it finishes.';
  mr.onstop=()=>{
    rec=false;spk.gain.value=1;['ex','ar','pl','sk','ql','ts','te','tpv'].forEach(i=>$(i).disabled=false);
    blob=new Blob(ch,{type:mt.split(';')[0]});
    const pv=$('pv');pv.src=URL.createObjectURL(blob);pv.hidden=false;
    $('sv').disabled=false;$('pb').style.width='100%';
    msg.textContent='Done. Preview below, then tap Save video ('+ext.toUpperCase()+').';
  };
  au.addEventListener('ended',()=>{if(mr.state!=='inactive')mr.stop()},{once:true});
  mr.start(500);await au.play();
};
$('sv').onclick=async()=>{
  if(!blob)return;
  try{
    const d=window.claude&&await claude.use('downloads');
    if(d){await d.save({filename:'pulseframe.'+ext,data:blob})}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pulseframe.'+ext;document.body.appendChild(a);a.click();a.remove()}
    msg.textContent='Saved.';
  }catch(e){msg.textContent=e&&e.code==='declined'?'Save cancelled.':'Couldn’t save: '+((e&&e.message)||e)}
};
